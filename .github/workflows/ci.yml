name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

# While s1-embedded is in the pre-flight stage, CI runs lint only. The CPU test suite and the lineage
# provenance gate are carried over from the parent project and will be re-enabled here once the Gemma 3
# student's tests and verified lineage land (see docs/plan.md).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Ruff
        run: uv run --only-group dev ruff check --output-format=github .
